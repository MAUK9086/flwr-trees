[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flwr_trees"]

[project]
name = "flwr-trees"
version = "0.1.0"
description = "Federated learning with tree-based models (Random Forest, XGBoost, GBT) via Flower"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
keywords = ["federated learning", "random forest", "xgboost", "flower", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flwr>=1.29.0",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
privacy = ["opacus>=1.4.0"]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
